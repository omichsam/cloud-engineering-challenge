services:
  java-app:
    build: .
    ports: ["8080:8080"]
    environment: {SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/library_db, SPRING_DATASOURCE_USERNAME: library_user, SPRING_DATASOURCE_PASSWORD: library_password}
    depends_on: [postgres]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: library_db, POSTGRES_USER: library_user, POSTGRES_PASSWORD: library_password}
    volumes: [postgres-data:/var/lib/postgresql/data]
volumes: {postgres-data: {}}
