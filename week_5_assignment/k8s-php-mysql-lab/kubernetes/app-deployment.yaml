apiVersion: apps/v1
kind: Deployment
metadata: {name: student-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: student-app}}
  template:
    metadata: {labels: {app: student-app}}
    spec:
      containers:
      - name: student-app
        image: student-app:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 80}]
        envFrom: [{configMapRef: {name: app-config}}, {secretRef: {name: app-secret}}]
        readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 15, periodSeconds: 20}
