services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
      MYSQL_DATABASE: ${DB_DATABASE:-task_tracker}
      MYSQL_USER: ${DB_USERNAME:-task_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
    volumes: [task-tracker-db-data:/var/lib/mysql]
  app:
    image: ${APP_IMAGE:-omarionya/task-tracker:latest}
    ports: ["8080:80"]
    environment: {DB_HOST: mysql, DB_PORT: 3306, DB_DATABASE: ${DB_DATABASE:-task_tracker}, DB_USERNAME: ${DB_USERNAME:-task_user}, DB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}}
    depends_on: [mysql]
volumes: {task-tracker-db-data: {}}
